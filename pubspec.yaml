name: read_pilot
description: 阅读，一个离线优先的 Flutter 阅读应用。
publish_to: none
version: 0.1.1+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  charset: ^2.0.1
  cryptography: ^2.9.0
  archive: 4.6.0
  xml: 7.1.0
  file_picker: ^10.3.0
  html: ^0.15.6
  http: ^1.6.0
  jsf: ^1.2.1
  json_path: ^0.9.0
  path: ^1.9.1
  path_provider: ^2.1.5
  sembast: ^3.8.5
  sembast_web: ^2.4.0
  lucide_icons_flutter: 3.1.17
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/books/
    - assets/branding/icon-master.png
    - android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
    - assets/fonts/OFL.txt
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
